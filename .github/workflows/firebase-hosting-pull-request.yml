    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Firebase CLI and Deploy Hosting (Direct CLI)
        run: |
          npm install -g firebase-tools
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_UN_HOUSE_GARAGE_MGT_SYSTEM_26 }}" > ./firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/firebase-service-account.json
          firebase deploy --only hosting --project un-house-garage-mgt-system-26 --debug
        working-directory: .
